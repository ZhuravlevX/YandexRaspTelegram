[package]
name = "backend"
description = "API wrapper for easy and fast usage of mosmetro API"
version = "1.1.0"
edition = "2024"

[dependencies]
serde = { version = "1", features = ["derive"] }
actix-web = { version = "4" }
actix-cors = "0.7"
awc = { version = "3.6", features = ["rustls"] }

dotenvy = "*"
envy = "*"

env_logger = "*"
log = "0.4.27"

strsim = "0.11.1"
parking_lot = "0.12.4"
moka = { version = "0.12.10", features = ["future"] }
url = "2.5.6"