[package]
name = "backend"
description = "API wrapper for easy and fast usage of mosmetro API"
version = "1.1.0"
edition = "2024"

[dependencies]
actix-web = { version = "4" }
actix-cors = "0.7"
awc = { version = "3.8", features = ["rustls"] }
reqwest ={ version = "0.12", features = ["rustls-tls", "json"]}

serde = { version = "1", features = ["derive"] }
serde_json = "1"

dotenvy = "*"
envy = "*"

env_logger = "*"
log = "0.4.28"
jiff = "0.2.15"

strsim = "0.11.1"
parking_lot = "0.12.4"
moka = { version = "0.12.11", features = ["future"] }
url = "2.5.7"